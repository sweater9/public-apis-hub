<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto Knowledge Base — Public APIs Hub</title>
  <style>
    :root {
      --bg:#0a0a0b; --bg2:#111113; --bg3:#18181b; --border:#27272a;
      --text:#f4f4f5; --muted:#a1a1aa; --accent:#a78bfa; --accent2:#67e8f9;
      --ok:#34d399; --bad:#f87171; --radius:12px;
      --font:"Inter",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:var(--font);color:var(--text);min-height:100vh;
      background:radial-gradient(1200px 600px at 10% -10%,#1a1030 0%,transparent 55%),
                 radial-gradient(900px 500px at 90% 0%,#0b1e2a 0%,transparent 50%),var(--bg);
    }
    header{padding:28px 24px 8px;max-width:860px;margin:0 auto}
    header h1{
      margin:0 0 6px;font-size:1.65rem;font-weight:650;letter-spacing:-0.02em;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    header p{margin:0;color:var(--muted);font-size:.95rem}
    nav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    nav a{
      text-decoration:none;color:var(--muted);border:1px solid var(--border);
      background:var(--bg3);border-radius:999px;padding:6px 12px;font-size:.85rem;
    }
    nav a:hover,nav a.active{color:var(--accent2);border-color:var(--accent)}
    .wrap{max-width:860px;margin:0 auto;padding:16px 24px 48px}
    .panel{
      background:color-mix(in srgb,var(--bg2) 88%,transparent);
      border:1px solid var(--border);border-radius:var(--radius);padding:16px;
      backdrop-filter:blur(8px);
    }
    .ask-row{display:flex;gap:10px;flex-wrap:wrap}
    input{
      flex:1;min-width:200px;background:var(--bg3);border:1px solid var(--border);
      color:var(--text);border-radius:8px;padding:12px 14px;font:inherit;outline:none;
    }
    input:focus{border-color:var(--accent);box-shadow:0 0 0 2px #a78bfa33}
    button{
      cursor:pointer;border:1px solid var(--border);background:linear-gradient(135deg,#4c1d95,#0e7490);
      color:#fff;border-radius:8px;padding:12px 16px;font:inherit;font-weight:600;
    }
    button:disabled{opacity:.55;cursor:wait}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .chip{
      border:1px solid var(--border);background:var(--bg3);color:var(--muted);
      border-radius:999px;padding:6px 10px;font-size:.78rem;cursor:pointer;
    }
    .chip:hover{color:var(--accent2);border-color:var(--accent)}
    .status{margin-top:10px;font-size:.78rem;color:var(--muted);font-family:var(--mono)}
    .status.err{color:var(--bad)} .status.ok{color:var(--ok)}
    .answer{
      margin-top:16px;background:#09090b;border:1px solid var(--border);
      border-radius:var(--radius);padding:18px 18px 14px;
    }
    .answer h2{margin:0 0 10px;font-size:1rem;color:var(--accent2);font-weight:600}
    .answer .body{font-size:1.05rem;line-height:1.55;white-space:pre-wrap}
    .citations{margin-top:16px}
    .citations summary{cursor:pointer;color:var(--muted);font-size:.85rem}
    .cite{
      margin-top:8px;padding:10px 12px;border:1px solid var(--border);
      border-radius:8px;background:var(--bg2);
    }
    .cite strong{display:block;margin-bottom:4px}
    .cite .snip{color:var(--muted);font-size:.85rem;line-height:1.4}
    .related{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
    .related button{
      background:var(--bg3);color:var(--text);font-weight:500;padding:7px 10px;font-size:.8rem;
    }
    footer{max-width:860px;margin:0 auto;padding:0 24px 32px;color:var(--muted);font-size:.8rem}
  </style>
</head>
<body>
  <header>
    <h1>Crypto Knowledge Base</h1>
    <p>Offline answers from a curated crypto &amp; blockchain corpus — no live free APIs.</p>
    <nav>
      <a href="/">Catalog</a>
      <a href="/tools">Live tools</a>
      <a class="active" href="/kb">Knowledge base</a>
    </nav>
  </header>
  <div class="wrap">
    <div class="panel">
      <form id="form" class="ask-row">
        <input id="q" placeholder="Ask anything about crypto or blockchain…" autocomplete="off" />
        <button id="go" type="submit">Ask</button>
      </form>
      <div class="chips" id="chips"></div>
      <div class="status" id="status">Ready · offline corpus</div>
      <div class="answer" id="answer" hidden>
        <h2>Answer</h2>
        <div class="body" id="answer-body"></div>
        <div class="related" id="related"></div>
        <details class="citations" id="citations-wrap" hidden>
          <summary>Sources used</summary>
          <div id="citations"></div>
        </details>
      </div>
    </div>
  </div>
  <footer>Answers are extractive from the local knowledge base on this service. Not financial advice.</footer>
  <script>
    const $ = (id) => document.getElementById(id);
    const suggestions = [
      "What is Bitcoin?",
      "How does Ethereum staking work?",
      "What are layer 2 rollups?",
      "CEX vs DEX",
      "What is impermanent loss?",
      "Hot wallets vs cold wallets",
    ];
    const chips = $("chips");
    suggestions.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = s;
      b.addEventListener("click", () => { $("q").value = s; ask(s); });
      chips.appendChild(b);
    });

    async function ask(q) {
      q = (q || "").trim();
      if (!q) return;
      $("go").disabled = true;
      $("status").className = "status";
      $("status").textContent = "Thinking from offline corpus…";
      try {
        const res = await fetch("/api/kb/ask?q=" + encodeURIComponent(q));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        $("answer").hidden = false;
        $("answer-body").textContent = data.answer || "(no answer)";
        const cites = $("citations");
        cites.innerHTML = "";
        const sources = data.sources || [];
        $("citations-wrap").hidden = sources.length === 0;
        sources.forEach((s) => {
          const el = document.createElement("div");
          el.className = "cite";
          el.innerHTML = `<strong>${escapeHtml(s.title || s.slug || "source")}</strong><div class="snip">${escapeHtml(s.snippet || s.text || "")}</div>`;
          cites.appendChild(el);
        });
        const rel = $("related");
        rel.innerHTML = "";
        (data.related || []).slice(0, 6).forEach((r) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = r.title || r.slug;
          b.addEventListener("click", () => {
            const nq = r.title || r.slug;
            $("q").value = nq;
            ask(nq);
          });
          rel.appendChild(b);
        });
        $("status").className = "status ok";
        $("status").textContent = `ok · ${sources.length} source(s) · offline`;
      } catch (e) {
        $("status").className = "status err";
        $("status").textContent = String(e.message || e);
      } finally {
        $("go").disabled = false;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }

    $("form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      ask($("q").value);
    });

    fetch("/api/kb/status").then(r => r.json()).then((j) => {
      if (j && j.ok) $("status").textContent = `Ready · ${j.doc_count || "?"} docs · offline`;
    }).catch(() => {});
  </script>
</body>
</html>
